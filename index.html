<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الخلفية | Background Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            /* رابط صورة التنين الصيني بالحبر الأحمر */
            background-image: url('https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* أزرار اللغات */
        .lang-container {
            position: fixed;
            top: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 1px solid #dc2626;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.7);
        }

        /* بطاقة نص الترحيب */
        .preview-card {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(220, 38, 38, 0.4);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.3);
            backdrop-filter: blur(8px);
            max-width: 400px;
        }

        .preview-card h1 {
            color: #dc2626;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .preview-card p {
            color: #d1d5db;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- أزرار اختيار اللغة -->
    <div class="lang-container">
        <button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('fr')">Français</button>
        <button class="lang-btn" onclick="setLanguage('ber')">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
    </div>

    <!-- بطاقة الترحيب -->
    <div class="preview-card">
        <h1 id="titleText">معاينة خلفية الموقع</h1>
        <p id="descText">هادي معاينة تجريبية للخلفية مع زر التبديل بين اللغات الأربع.</p>
    </div>
