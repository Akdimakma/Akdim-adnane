<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKMA | Links</title>
<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: #0f0f11;
color: #ffffff;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
width: 100%;
max-width: 420px;
background: rgba(20, 20, 25, 0.8);
backdrop-filter: blur(12px);
border: 1px solid rgba(220, 38, 38, 0.3);
border-radius: 20px;
padding: 30px 20px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(220, 38, 38, 0.2);
text-align: center;
}

.lang-switch {
display: flex;
justify-content: center;
gap: 8px;
margin-bottom: 25px;
flex-wrap: wrap;
}

.lang-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: #ccc;
padding: 6px 12px;
border-radius: 20px;
cursor: pointer;
font-size: 0.85rem;
transition: all 0.3s ease;
}

.lang-btn:hover, .lang-btn.active {
background: #dc2626;
color: #fff;
border-color: #dc2626;
box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
}

.profile {
margin-bottom: 25px;
}

.profile-img {
width: 90px;
height: 90px;
border-radius: 50%;
border: 2px solid #dc2626;
padding: 3px;
margin-bottom: 15px;
object-fit: cover;
}

.profile h1 {
font-size: 1.5rem;
font-weight: 700;
letter-spacing: 1px;
margin-bottom: 5px;
}

.profile p {
color: #a1a1aa;
font-size: 0.9rem;
}

.links {
display: flex;
flex-direction: column;
gap: 15px;
}

.link-card {
display: flex;
align-items: center;
justify-content: space-between;
background: rgba(30, 30, 35, 0.6);
border: 1px solid rgba(220, 38, 38, 0.2);
padding: 14px 20px;
border-radius: 12px;
color: #ffffff;
text-decoration: none;
font-weight: 600;
transition: all 0.3s ease;
}

.link-card:hover {
background: rgba(220, 38, 38, 0.15);
border-color: #dc2626;
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
}

.link-card i {
font-size: 1.3rem;
width: 25px;
}

.link-card span {
flex-grow: 1;
text-align: center;
}
</style>
</head>
<body>

<div class="container">
<!-- Language Switcher -->
<div class="lang-switch">
<button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
<button class="lang-btn" onclick="setLanguage('en')">English</button>
<button class="lang-btn" onclick="setLanguage('fr')">Français</button>
<button class="lang-btn" onclick="setLanguage('ber')">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
</div>

<!-- Profile Header -->
<div class="profile">
<img src="https://via.placeholder.com/90" alt="AKMA Profile" class="profile-img">
<h1>AKMA</h1>
<p id="bio">مرحباً بكم في صفحتي الشخصية</p>
</div>

<!-- Social Links -->
<div class="links">
<!-- Instagram -->
<a href="https://www.instagram.com/kacm_adnan?obrf=M25xdW1tNGFkdXJo
" target="_blank" class="link-card">
<i class="fab fa-instagram" style="color: #e1306c;"></i>
<span id="label-instagram">إنستغرام</span>
<i class="fas fa-arrow-left arrow-icon"></i>
</a>

<!-- WhatsApp -->
<a href="https://wa.me/212614060332" target="_blank" class="link-card">
<i class="fab fa-whatsapp" style="color: #25d366;"></i>
<span id="label-whatsapp">واتساب</span>
<i class="fas fa-arrow-left arrow-icon"></i>
</a>

<!-- Gmail -->
<a href="mailto:akdimadnane@gmail.com" class="link-card">
<i class="fas fa-envelope" style="color: #ea4335;"></i>
<span id="label-gmail">البريد الإلكتروني</span>
<i class="fas fa-arrow-left arrow-icon"></i>
</a>
</div>
</div>

<script>
const translations = {
ar: {
dir: 'rtl',
bio: 'مرحباً بكم في صفحتي الشخصية',
instagram: 'إنستغرام',
whatsapp: 'واتساب',
gmail: 'البريد الإلكتروني',
arrow: 'fa-arrow-left'
},
en: {
dir: 'ltr',
bio: 'Welcome to my personal links',
instagram: 'Instagram',
whatsapp: 'WhatsApp',
gmail: 'Gmail',
arrow: 'fa-arrow-right'
},
fr: {
dir: 'ltr',
bio: 'Bienvenue sur مa page personnelle',
instagram: 'Instagram',
whatsapp: 'WhatsApp',
gmail: 'E-mail',
arrow: 'fa-arrow-right'
},
ber: {
dir: 'ltr',
bio: 'أنسgrouped ⵖ ⵜⴰⵙⵏⴰ ⵉⵏⵓ',
instagram: 'Instagram',
whatsapp: 'WhatsApp',
gmail: 'Gmail',
arrow: 'fa-arrow-right'
}
};

function setLanguage(lang) {
const data = translations[lang];

// Text & Direction updates
document.documentElement.dir = data.dir;
document.getElementById('bio').innerText = data.bio;
document.getElementById('label-instagram').innerText = data.instagram;
document.getElementById('label-whatsapp').innerText = data.whatsapp;
document.getElementById('label-gmail').innerText = data.gmail;

// Update arrow icons direction
const arrows = document.querySelectorAll('.arrow-icon');
arrows.forEach(arrow => {
arrow.className = fas ${data.arrow} arrow-icon;
});

// Update active button state
const buttons = document.querySelectorAll('.lang-btn');
buttons.forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
}
</script>
</body>
</html>
