<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADNANE AKDIM | Links</title>

    <!-- PWA Link & Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ADNANE AKDIM">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية ممتدة بالكامل (Cover) ومضبوطة فـ الوسط لجميع الشاشات */
        body {
            background: linear-gradient(rgba(10, 10, 12, 0.4), rgba(10, 10, 12, 0.4)), 
                        url('dragon.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 15, 20, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(220, 38, 38, 0.35);
            text-align: center;
            position: relative;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
        }

        .profile {
            margin-bottom: 25px;
        }

        .img-container {
            position: relative;
            width: 95px;
            height: 95px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #dc2626;
            padding: 3px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
            animation: pulseGlow 3s infinite alternate;
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border: 2px solid #0f0f13;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(220, 38, 38, 0.4); }
            100% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
        }

        .profile h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            user-select: none;
        }

        .profile p {
            color: #d1d1d6;
            font-size: 0.9rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            min-height: 24px;
        }

        .typing-cursor {
            display: inline-block;
            background-color: #dc2626;
            width: 2px;
            height: 15px;
            animation: blink 0.7s infinite;
            margin-right: 3px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .link-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 25, 0.55);
            border: 1px solid rgba(220, 38, 38, 0.35);
            padding: 14px 18px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .link-card:hover {
            background: rgba(220, 38, 38, 0.3);
            border-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
        }

        .link-card i {
            font-size: 1.3rem;
            width: 25px;
        }

        .link-card span {
            flex-grow: 1;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .copy-btn {
            background: rgba(20, 20, 25, 0.55);
            border: 1px solid rgba(220, 38, 38, 0.35);
            color: #ccc;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .copy-btn:hover {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        .action-sec {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(220, 38, 38, 0.25);
            border: 1px solid rgba(220, 38, 38, 0.45);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        .admin-panel {
            margin-top: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(220, 38, 38, 0.6);
            padding: 12px;
            border-radius: 14px;
            animation: fadeIn 0.5s ease;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #ffffff;
        }

        .install-pwa-btn {
            background: #dc2626;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
            transition: all 0.3s ease;
        }

        .install-pwa-btn:hover {
            background: #ef4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .qr-card {
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(220, 38, 38, 0.6);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(220, 38, 38, 0.4);
            max-width: 320px;
            width: 90%;
        }

        .qr-card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .qr-box {
            background: #ffffff;
            padding: 12px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .close-qr {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #a1a1aa;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-qr:hover {
            color: #dc2626;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
            display: none;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أزرار اللغات -->
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ar', event)">العربية</button>
            <button class="lang-btn" onclick="setLanguage('en', event)">English</button>
            <button class="lang-btn" onclick="setLanguage('fr', event)">Français</button>
            <button class="lang-btn" onclick="setLanguage('ber', event)">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
        </div>

        <!-- البروفايل -->
        <div class="profile">
            <div class="img-container">
                <img src="profile.jpg" alt="ADNANE AKDIM Profile" class="profile-img">
                <div class="status-badge" title="Active"></div>
            </div>
            <h1 onclick="checkAdminAccess()">ADNANE AKDIM</h1>
            <p><span id="bio"></span><span class="typing-cursor"></span></p>
        </div>

        <!-- الروابط -->
        <div class="links">
            <!-- Instagram -->
            <div class="link-wrapper">
                <a href="https://www.instagram.com/kacm_adnan?obrf=M25xdW1tNGFkdXJo" target="_blank" class="link-card">
                    <i class="fab fa-instagram" style="color: #e1306c;"></i>
                    <span id="label-instagram">إنستغرام</span>
                    <i class="fas fa-arrow-left arrow-icon"></i>
                </a>
                <button class="copy-btn" onclick="copyToClipboard('kacm_adnan')" title="نسخ اسم الحساب">
                    <i class="fas fa-copy"></i>
                </button>
            </div>

            <!-- WhatsApp -->
            <div class="link-wrapper">
                <a href="https://wa.me/212614060332" target="_blank" class="link-card">
                    <i class="fab fa-whatsapp" style="color: #25d366;"></i>
                    <span id="label-whatsapp">واتساب</span>
                    <i class="fas fa-arrow-left arrow-icon"></i>
                </a>
                <button class="copy-btn" onclick="copyToClipboard('+212614060332')" title="نسخ الرقم">
                    <i class="fas fa-copy"></i>
                </button>
            </div>

            <!-- Gmail -->
            <div class="link-wrapper">
                <a href="mailto:akdimadnane@gmail.com" class="link-card">
                    <i class="fas fa-envelope" style="color: #ea4335;"></i>
                    <span id="label-gmail">البريد الإلكتروني</span>
                    <i class="fas fa-arrow-left arrow-icon"></i>
                </a>
                <button class="copy-btn" onclick="copyToClipboard('akdimadnane@gmail.com')" title="نسخ البريد">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- أزرار التفاعل العامة -->
        <div class="action-sec">
            <button class="action-btn" onclick="shareProfile()">
                <i class="fas fa-share-alt"></i>
                <span id="label-share">مشاركة الصفحة</span>
            </button>
            <button class="action-btn" onclick="downloadVCard()">
                <i class="fas fa-user-plus"></i>
                <span id="label-save">حفظ الاتصال</span>
            </button>
            <button class="action-btn" onclick="openQrModal()">
                <i class="fas fa-qrcode"></i>
                <span id="label-qr">رمز QR</span>
            </button>
        </div>

        <!-- حقوق الصفحة ولوحة التحكم السرية -->
        <footer>
            <div>© 2026 ADNANE AKDIM | All rights reserved</div>
            
            <div class="admin-panel" id="admin-panel">
                <div class="visitor-counter">
                    <i class="fas fa-eye" style="color: #dc2626;"></i>
                    <span id="label-views">إجمالي الزيارات:</span>
                    <span id="visits-count" style="font-weight: bold; color: #22c55e;">...</span>
                </div>
                <button class="install-pwa-btn" onclick="installPwaApp()">
                    <i class="fas fa-download"></i>
                    <span>تثبيت الموقع كتطبيق</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- نافذة الـ QR Code -->
    <div class="qr-modal" id="qrModal" onclick="closeQrModal(event)">
        <div class="qr-card">
            <span class="close-qr" onclick="closeQrModalDirect()">&times;</span>
            <h3 id="label-qr-title">امسح الرمز لزيارة الصفحة</h3>
            <div class="qr-box">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم النسخ بنجاح!</div>

    <script>
        const translations = {
            ar: {
                dir: 'rtl',
                bio: 'مرحباً بكم في صفحتي الشخصية',
                instagram: 'إنستغرام',
                whatsapp: 'واتساب',
                gmail: 'البريد الإلكتروني',
                share: 'مشاركة الصفحة',
                save: 'حفظ الاتصال',
                qr: 'رمز QR',
                qrTitle: 'امسح الرمز لزيارة الصفحة',
                views: 'إجمالي الزيارات:',
                arrow: 'fa-arrow-left'
            },
            en: {
                dir: 'ltr',
                bio: 'Welcome to my personal links',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'Gmail',
                share: 'Share Profile',
                save: 'Save Contact',
                qr: 'QR Code',
                qrTitle: 'Scan Code to Visit Profile',
                views: 'Total Views:',
                arrow: 'fa-arrow-right'
            },
            fr: {
                dir: 'ltr',
                bio: 'Bienvenue sur ma page personnelle',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'E-mail',
                share: 'Partager la page',
                save: 'Enregistrer',
                qr: 'Code QR',
                qrTitle: 'Scannez le code pour visiter',
                views: 'Vues Totales:',
                arrow: 'fa-arrow-right'
            },
            ber: {
                dir: 'ltr',
                bio: 'أنسgrouped ⵖ ⵜⴰⵙⵏⴰ ⵉⵏⵓ',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'Gmail',
                share: 'Partager',
                save: 'Save Contact',
                qr: 'QR Code',
                qrTitle: 'Scan QR Code',
                views: 'Views:',
                arrow: 'fa-arrow-right'
            }
        };

        let typingTimeout;

        function typeWriter(text, i = 0) {
            if (i < text.length) {
                document.getElementById('bio').innerHTML += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, i + 1), 70);
            }
        }

        function setLanguage(lang, evt) {
            const data = translations[lang];
            document.documentElement.dir = data.dir;
            
            clearTimeout(typingTimeout);
            document.getElementById('bio').innerHTML = '';
            typeWriter(data.bio);

            document.getElementById('label-instagram').innerText = data.instagram;
            document.getElementById('label-whatsapp').innerText = data.whatsapp;
            document.getElementById('label-gmail').innerText = data.gmail;
            document.getElementById('label-share').innerText = data.share;
            document.getElementById('label-save').innerText = data.save;
            document.getElementById('label-qr').innerText = data.qr;
            document.getElementById('label-qr-title').innerText = data.qrTitle;
            document.getElementById('label-views').innerText = data.views;

            const arrows = document.querySelectorAll('.arrow-icon');
            arrows.forEach(arrow => {
                arrow.className = `fas ${data.arrow} arrow-icon`;
            });

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'ADNANE AKDIM | Links',
                    url: window.location.href
                });
            } else {
                copyToClipboard(window.location.href);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function downloadVCard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:ADNANE AKDIM\nTEL;TYPE=CELL:+212614060332\nEMAIL:akdimadnane@gmail.com\nURL:https://akdimakma.github.io\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const newLink = document.createElement('a');
            newLink.download = 'ADNANE_AKDIM.vcf';
            newLink.href = url;
            newLink.click();
        }

        let qrGenerated = false;
        function openQrModal() {
            document.getElementById('qrModal').style.display = 'flex';
            if (!qrGenerated) {
                new QRCode(document.getElementById("qrcode"), {
                    text: window.location.href,
                    width: 170,
                    height: 170,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        }

        function closeQrModal(e) {
            if (e.target.id === 'qrModal') {
                document.getElementById('qrModal').style.display = 'none';
            }
        }

        function closeQrModalDirect() {
            document.getElementById('qrModal').style.display = 'none';
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installPwaApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        alert('جاري تثبيت التطبيق بنجاح!');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('التطبيق مثبت بالفعل أو يتيح المتصفح التثبيت المباشر من قائمة المتصفح.');
            }
        }

        let clickCount = 0;
        let clickTimer;
        function checkAdminAccess() {
            clickCount++;
            clearTimeout(clickTimer);

            if (clickCount === 9) {
                clickCount = 0;
                let password = prompt("أدخل رمز المشرف السري:");
                if (password === "7002") {
                    const panel = document.getElementById('admin-panel');
                    if (panel.style.display === 'flex') {
                        panel.style.display = 'none';
                        alert('تم إخفاء لوحة التحكم السرية.');
                    } else {
                        panel.style.display = 'flex';
                        alert('مرحباً عدنان! تم فتح لوحة التحكم بنجاح.');
                    }
                } else if (password !== null) {
                    alert('كلمة المرور غير صحيحة!');
                }
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            }
        }

        async function fetchVisits() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/akdimakma.github.io/visits');
                const data = await response.json();
                document.getElementById('visits-count').innerText = data.value;
            } catch (err) {
                document.getElementById('visits-count').innerText = '100+';
            }
        }

        window.onload = () => {
            typeWriter(translations['ar'].bio);
            fetchVisits();
        };
    </script>
</body>
</html>
