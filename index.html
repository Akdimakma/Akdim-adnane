<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKMA | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            background-image: url('https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .lang-container {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #dc2626;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 35px 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.4);
            margin-top: 60px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dc2626;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
        }

        .username {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
        }

        .bio {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 25px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(20, 20, 20, 0.8);
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .link-card i {
            font-size: 20px;
            width: 25px;
        }

        .link-card:hover {
            background: rgba(220, 38, 38, 0.25);
            border-color: #dc2626;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
        }

        .fa-instagram { color: #e1306c; }
        .fa-tiktok { color: #00f2fe; }
        .fa-youtube { color: #ff0000; }
        .fa-whatsapp { color: #25d366; }
        .fa-envelope { color: #dc2626; }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="lang-container">
        <button class="lang-btn active" onclick="setLanguage('ar', event)">العربية</button>
        <button class="lang-btn" onclick="setLanguage('en', event)">English</button>
        <button class="lang-btn" onclick="setLanguage('fr', event)">Français</button>
        <button class="lang-btn" onclick="setLanguage('ber', event)">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
    </div>

    <div class="container">
        <img src="https://via.placeholder.com/150" alt="AKMA" class="profile-img">

        <div class="username">AKMA</div>
        <p class="bio" id="bioText">مرحباً بكم في صفحتي الرسمية</p>

        <div class="links-wrapper">
            <a href="https://instagram.com/AKMA_USERNAME" target="_blank" class="link-card">
                <span class="link-text" data-ar="إنستغرام" data-en="Instagram" data-fr="Instagram" data-ber="ⵉⵏⵙⵜⴰⴳⵔⴰⵎ">إنستغرام</span>
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://tiktok.com/@AKMA_USERNAME" target="_blank" class="link-card">
                <span class="link-text" data-ar="تيك توك" data-en="TikTok" data-fr="TikTok" data-ber="ⵜⵉⴽⵜⵓⴽ">تيك توك</span>
                <i class="fab fa-tiktok"></i>
            </a>

            <a href="https://youtube.com/@AKMA_USERNAME" target="_blank" class="link-card">
                <span class="link-text" data-ar="يوتيوب" data-en="YouTube" data-fr="YouTube" data-ber="ⵢⵓⵜⵓⴱ">يوتيوب</span>
                <i class="fab fa-youtube"></i>
            </a>

            <a href="https://wa.me/212600000000" target="_blank" class="link-card">
                <span class="link-text" data-ar="واتساب" data-en="WhatsApp" data-fr="WhatsApp" data-ber="ⵡⴰⵜⵙⴰⴱ">واتساب</span>
                <i class="fab fa-whatsapp"></i>
            </a>

            <a href="mailto:akma@example.com" class="link-card">
                <span class="link-text" data-ar="البريد الإلكتروني" data-en="Email" data-fr="E-mail" data-ber="ⵉⵎⴰⵢⵍ">البريد الإلكتروني</span>
                <i class="fas fa-envelope"></i>
            </a>
        </div>

        <div class="footer" id="footerText">
            © 2026 AKMA. جميع الحقوق محفوظة.
        </div>
    </div>

    <script>
        const translations = {
            ar: { dir: 'rtl', bio: 'مرحباً بكم في صفحتي الرسمية', footer: '© 2026 AKMA. جميع الحقوق محفوظة.' },
            en: { dir: 'ltr', bio: 'Welcome to my official page', footer: '© 2026 AKMA. All rights reserved.' },
            fr: { dir: 'ltr', bio: 'Bienvenue sur ma page officielle', footer: '© 2026 AKMA. Tous droits réservés.' },
            ber: { dir: 'ltr', bio: 'ⴰⵏⵙⵓⴼ ⵢⵉⵙⵡⴰⵏ ⵖⵔ ⵜⴰⵙⵏⴰ ⵉⵏⵓ', footer: '© 2026 AKMA. ⵉⵣⵔⴼⴰⵏ ⴽⵓⵍⵍⵓ ⵜⵜⵓⵃⴹⴰⵏ.' }
        };

        function setLanguage(lang, evt) {
            const html = document.documentElement;
            const bioText = document.getElementById('bioText');
            const footerText = document.getElementById('footerText');
            const linkTexts = document.querySelectorAll('.link-text');
            const buttons = document.querySelectorAll('.lang-btn');

            html.setAttribute('lang', lang);
            html.setAttribute('dir', translations[lang].dir);

            bioText.textContent = translations[lang].bio;
            footerText.textContent = translations[lang].footer;

            linkTexts.forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            buttons.forEach(btn => btn.classList.remove('active'));
            if(evt && evt.target) evt.target.classList.add('active');
        }
    </script>

</body>
</html>
