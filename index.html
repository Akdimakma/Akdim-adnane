<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADNANE AKDIM | Links</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 15, 17, 0.37), rgba(15, 15, 17, 0.37)), 
                        url('dragon.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 15, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(220, 38, 38, 0.3);
            text-align: center;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
        }

        .profile {
            margin-bottom: 25px;
        }

        .img-container {
            position: relative;
            width: 95px;
            height: 95px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #dc2626;
            padding: 3px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
            animation: pulseGlow 3s infinite alternate;
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border: 2px solid #0f0f13;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(220, 38, 38, 0.4); }
            100% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
        }

        .profile h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            user-select: none;
        }

        .profile p {
            color: #d1d1d6;
            font-size: 0.9rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            min-height: 24px;
        }

        .typing-cursor {
            display: inline-block;
            background-color: #dc2626;
            width: 2px;
            height: 15px;
            animation: blink 0.7s infinite;
            margin-right: 3px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 25, 0.45);
            border: 1px solid rgba(220, 38, 38, 0.3);
            padding: 14px 20px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .link-card:hover {
            background: rgba(220, 38, 38, 0.25);
            border-color: #dc2626;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
        }

        .link-card i {
            font-size: 1.3rem;
            width: 25px;
        }

        .link-card span {
            flex-grow: 1;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .action-sec {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .share-btn {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .share-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        /* العداد السري */
        .visitor-counter {
            margin-top: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #ffffff;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .visitor-counter i {
            color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أزرار اللغات -->
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ar', event)">العربية</button>
            <button class="lang-btn" onclick="setLanguage('en', event)">English</button>
            <button class="lang-btn" onclick="setLanguage('fr', event)">Français</button>
            <button class="lang-btn" onclick="setLanguage('ber', event)">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
        </div>

        <!-- البروفايل -->
        <div class="profile">
            <div class="img-container">
                <img src="profile.jpg" alt="ADNANE AKDIM Profile" class="profile-img">
                <div class="status-badge" title="Active"></div>
            </div>
            <!-- النقر 9 مرات على الاسم لتشغيل العداد -->
            <h1 onclick="checkAdminAccess()">ADNANE AKDIM</h1>
            <p><span id="bio"></span><span class="typing-cursor"></span></p>
        </div>

        <!-- الروابط -->
        <div class="links">
            <a href="https://www.instagram.com/kacm_adnan?obrf=M25xdW1tNGFkdXJo" target="_blank" class="link-card">
                <i class="fab fa-instagram" style="color: #e1306c;"></i>
                <span id="label-instagram">إنستغرام</span>
                <i class="fas fa-arrow-left arrow-icon"></i>
            </a>

            <a href="https://wa.me/212614060332" target="_blank" class="link-card">
                <i class="fab fa-whatsapp" style="color: #25d366;"></i>
                <span id="label-whatsapp">واتساب</span>
                <i class="fas fa-arrow-left arrow-icon"></i>
            </a>

            <a href="mailto:akdimadnane@gmail.com" class="link-card">
                <i class="fas fa-envelope" style="color: #ea4335;"></i>
                <span id="label-gmail">البريد الإلكتروني</span>
                <i class="fas fa-arrow-left arrow-icon"></i>
            </a>
        </div>

        <!-- زر المشاركة -->
        <div class="action-sec">
            <button class="share-btn" onclick="shareProfile()">
                <i class="fas fa-share-alt"></i>
                <span id="label-share">مشاركة الصفحة</span>
            </button>
        </div>

        <!-- حقوق الصفحة والعداد السري -->
        <footer>
            <div>© 2026 ADNANE AKDIM | All rights reserved</div>
            
            <div class="visitor-counter" id="secret-counter">
                <i class="fas fa-eye"></i>
                <span id="label-views">إجمالي الزيارات (خاص بك):</span>
                <span id="visits-count" style="font-weight: bold; color: #22c55e;">...</span>
            </div>
        </footer>
    </div>

    <script>
        const translations = {
            ar: {
                dir: 'rtl',
                bio: 'مرحباً بكم في صفحتي الشخصية',
                instagram: 'إنستغرام',
                whatsapp: 'واتساب',
                gmail: 'البريد الإلكتروني',
                share: 'مشاركة الصفحة',
                views: 'إجمالي الزيارات (خاص بك):',
                arrow: 'fa-arrow-left'
            },
            en: {
                dir: 'ltr',
                bio: 'Welcome to my personal links',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'Gmail',
                share: 'Share Profile',
                views: 'Total Views (Admin Only):',
                arrow: 'fa-arrow-right'
            },
            fr: {
                dir: 'ltr',
                bio: 'Bienvenue sur ma page personnelle',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'E-mail',
                share: 'Partager la page',
                views: 'Vues Totales (Privé):',
                arrow: 'fa-arrow-right'
            },
            ber: {
                dir: 'ltr',
                bio: 'أنسgrouped ⵖ ⵜⴰⵙⵏⴰ ⵉⵏⵓ',
                instagram: 'Instagram',
                whatsapp: 'WhatsApp',
                gmail: 'Gmail',
                share: 'Partager',
                views: 'Views:',
                arrow: 'fa-arrow-right'
            }
        };

        let typingTimeout;

        function typeWriter(text, i = 0) {
            if (i < text.length) {
                document.getElementById('bio').innerHTML += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, i + 1), 70);
            }
        }

        function setLanguage(lang, evt) {
            const data = translations[lang];
            document.documentElement.dir = data.dir;
            
            clearTimeout(typingTimeout);
            document.getElementById('bio').innerHTML = '';
            typeWriter(data.bio);

            document.getElementById('label-instagram').innerText = data.instagram;
            document.getElementById('label-whatsapp').innerText = data.whatsapp;
            document.getElementById('label-gmail').innerText = data.gmail;
            document.getElementById('label-share').innerText = data.share;
            document.getElementById('label-views').innerText = data.views;

            const arrows = document.querySelectorAll('.arrow-icon');
            arrows.forEach(arrow => {
                arrow.className = `fas ${data.arrow} arrow-icon`;
            });

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'ADNANE AKDIM | Links',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الصفحة بنجاح!');
            }
        }

        // نظام الحماية بـ 9 ضغطات وكلمة سر 7002
        let clickCount = 0;
        let clickTimer;
        function checkAdminAccess() {
            clickCount++;
            clearTimeout(clickTimer);

            if (clickCount === 9) {
                clickCount = 0;
                let password = prompt("أدخل رمز المشرف السري:");
                if (password === "7002") {
                    const counter = document.getElementById('secret-counter');
                    if (counter.style.display === 'flex') {
                        counter.style.display = 'none';
                        alert('تم إخفاء العداد.');
                    } else {
                        counter.style.display = 'flex';
                        alert('مرحباً بك عدنان! تم تفعيل عرض العداد بنجاح.');
                    }
                } else if (password !== null) {
                    alert('كلمة المرور غير صحيحة!');
                }
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            }
        }

        async function fetchVisits() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/akdimakma.github.io/visits');
                const data = await response.json();
                document.getElementById('visits-count').innerText = data.value;
            } catch (err) {
                document.getElementById('visits-count').innerText = '100+';
            }
        }

        window.onload = () => {
            typeWriter(translations['ar'].bio);
            fetchVisits();
        };
    </script>
</body>
</html>
