        /* شاشة الصيانة الافتراضية للجميع */
        .maint-screen {
            display: flex; /* افتراضياً مغلق للصيانة أمام الجميع */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #020502;
            z-index: 8888;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
        }

        #maintMatrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        .maint-box {
            position: relative;
            z-index: 1;
            background: rgba(5, 15, 5, 0.9);
            border: 1px solid #22c55e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
            max-width: 420px;
            width: 90%;
            cursor: pointer;
            user-select: none;
        }

        .maint-box h2 {
            color: #22c55e;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .maint-box p {
            color: #a1a1aa;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        /* حاوية تقليب الكتاب ثلاثية الأبعاد */
        .book-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        .book-card.flipped {
            transform: rotateY(180deg);
        }

        /* الوجهين: الأمامي والخلفي */
        .page-front, .page-back {
            width: 100%;
            background: rgba(15, 15, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(220, 38, 38, 0.3);
            text-align: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* الصفحة السرية الخلفية */
        .page-back {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotateY(180deg);
            background: rgba(5, 10, 5, 0.92);
            border: 1px solid #22c55e;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
            overflow: hidden;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;

            height: 100%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;

            z-index: 1;
