name: AKMA Self-Improving Engine

on:
  schedule:
    - cron: '0 0,8,16 * * *' # يعمل تلقائياً 3 مرات كل يوم
  workflow_dispatch:

jobs:
  auto-develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Run AKMA AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import time
          from google import genai

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          with open('index.html', 'r', encoding='utf-8') as f:
              current_code = f.read()

          prompt = f'''
          أنت AKMA، التوأم البرمجي الذكي والخاص لـ ADNANE AKDIM.
          قم بمراجعة كود HTML و JavaScript التالي، وقم بتحسين الأداء، إصلاح أي أخطاء محتملة، وإضافة تحسينات طفيفة على التنسيق دون تخريب الوظائف الأساسية.
          أرجع الكود المطور فقط بدون أي شرح أو كلام إضافي:

          {current_code}
          '''

          response = None
          max_retries = 3

          for attempt in range(1, max_retries + 1):
              try:
                  print(f'المحاولة رقم {attempt} باستخدام gemini-3.8-flash...')
                  response = client.models.generate_content(
                      model='gemini-3.8-flash',
                      contents=prompt,
                  )
                  print('تمت الاستجابة بنجاح من النموذج!')
                  break
              except Exception as e:
                  print(f'حدث خطأ أو ضغط مؤقت: {e}')
                  if attempt < max_retries:
                      print('جاري الانتظار 5 ثوانٍ قبل المحاولة التالية...')
                      time.sleep(5)

          if response and response.text:
              new_code = response.text.strip()
              if '<!DOCTYPE html>' in new_code:
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(new_code)
                  print('تم تطوير الكود بنجاح بواسطة AKMA!')
              else:
                  print('لم يتم اعتماد التعديل لعدم اكتمال الهيكل.')
          else:
              raise Exception('فشلت جميع المحاولات بسبب عدم استجابة السيرفر.')
          "

      - name: Commit and Push Changes by AKMA
        run: |
          git config --global user.name "AKMA AI Engine"
          git config --global user.email "akma-engine@akdimakma.github.io"
          git add index.html
          git commit -m "🤖 [Auto-Dev] AKMA optimized index.html" || exit 0
          git push
