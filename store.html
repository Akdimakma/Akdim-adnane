<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKMA STORE | Storefront</title>
    <meta name="theme-color" content="#dc2626">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, rgba(30, 10, 15, 0.5), rgba(5, 5, 8, 0.95)), 
                        url('dragon.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px 40px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(12, 12, 18, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand-logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .brand-logo span { color: #ef4444; }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 8px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #dc2626;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .page-title p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* حالة اغلاق المتجر */
        .store-closed-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 24px;
            margin-top: 40px;
        }

        .store-closed-screen h2 {
            color: #ef4444;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .store-closed-screen p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: rgba(12, 12, 18, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.25);
        }

        .product-img-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .product-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 15px;
            flex: 1;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ef4444;
        }

        .order-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .order-btn:hover {
            background: #b91c1c;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
        }

        .delete-prod-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Modal Forms */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(18, 18, 26, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 24px;
            padding: 26px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: #ef4444;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #ef4444;
        }

        .submit-btn {
            width: 100%;
            background: #25d366;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .submit-btn.admin-action {
            background: #dc2626;
        }
        .submit-btn.admin-action:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="brand-logo">AKMA <span>STORE</span></a>
            <div class="header-actions">
                <button class="action-btn" onclick="openAdminModal()">⚙️ لوحة التحكم</button>
                <a href="index.html" class="action-btn">الرئيسية</a>
            </div>
        </header>

        <div class="page-title">
            <h1>المتجر الرسمي</h1>
            <p>تسوق أفضل المنتجات المادية بضغطة زر واحدة</p>
        </div>

        <!-- شاشة المتجر المغلق -->
        <div class="store-closed-screen" id="storeClosedScreen">
            <h2>⚠️ المتجر مغلق مؤقتاً</h2>
            <p>نعتذر منك، المتجر متوقف عن استقبال الطلبات حالياً للصيانة أو تحديث المخزون. يرجى العودة لاحقاً.</p>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة طلب الشراء -->
    <div class="modal-overlay" id="orderModal" onclick="closeModal(event, 'orderModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalProductTitle">إتمام الطلب</h3>
                <button class="close-modal" onclick="hideModal('orderModal')">&times;</button>
            </div>
            <form onsubmit="sendWhatsAppOrder(event)">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" class="form-control" id="custName" required placeholder="مثال: عدنان أقديم">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" class="form-control" id="custPhone" required placeholder="مثال: 0614060332">
                </div>
                <div class="form-group">
                    <label>المدينة والعنوان:</label>
                    <input type="text" class="form-control" id="custCity" required placeholder="مثال: مراكش، حي السلام">
                </div>
                <div class="form-group">
                    <label>الكمية:</label>
                    <input type="number" class="form-control" id="custQty" value="1" min="1" required>
                </div>
                <button type="submit" class="submit-btn">تأكيد الطلب عبر واتساب</button>
            </form>
        </div>
    </div>

    <!-- نافذة لوحة التحكم (إضافة منتج وتفتح/إغلاق المتجر) -->
    <div class="modal-overlay" id="adminModal" onclick="closeModal(event, 'adminModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ إعدادات المتجر وإضافة السلع</h3>
                <button class="close-modal" onclick="hideModal('adminModal')">&times;</button>
            </div>
            
            <div style="margin-bottom: 20px;">
                <button class="submit-btn admin-action" id="toggleStoreStatusBtn" onclick="toggleStoreStatus()">تبديل حالة المتجر (فتح/إغلاق)</button>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: 20px;">

            <h4 style="font-size: 0.95rem; margin-bottom: 12px; color: #cbd5e1;">إضافة منتج جديد بسرعة:</h4>
            <form onsubmit="addNewProduct(event)">
                <div class="form-group">
                    <label>عنوان المنتج:</label>
                    <input type="text" class="form-control" id="newTitle" required placeholder="مثال: قميص فاخر">
                </div>
                <div class="form-group">
                    <label>السعر (مثال: 150 MAD):</label>
                    <input type="text" class="form-control" id="newPrice" required placeholder="150 MAD">
                </div>
                <div class="form-group">
                    <label>رابط الصورة (رابط مباشر للصورة):</label>
                    <input type="text" class="form-control" id="newImg" required placeholder="profile.jpg أو رابط صورة">
                </div>
                <div class="form-group">
                    <label>وصف مختصر:</label>
                    <input type="text" class="form-control" id="newDesc" required placeholder="مواصفات المنتج...">
                </div>
                <button type="submit" class="submit-btn admin-action">إضافة المنتج للمتجر</button>
            </form>
        </div>
    </div>

    <script>
        // المنتجات الافتراضية الأولية في حال لم تقم بإضافة منتجات بعد
        let defaultProducts = [
            { id: 1, title: "قميص AKMA المخصص", price: "199 MAD", img: "profile.jpg", desc: "قميص عصري بتصميم خاص وجودة عالية." },
            { id: 2, title: "بطاقة NFC الذكية", price: "149 MAD", img: "profile.jpg", desc: "بطاقة فاخرة لمشاركة روابطك بلمسة واحدة." },
            { id: 3, title: "غطاء هاتف AKMA", price: "99 MAD", img: "profile.jpg", desc: "حماية ممتازة لهاتفك بتصميم تنين الحماية." }
        ];

        // جلب البيانات من localStorage أو استخدام الافتراضية
        let products = JSON.parse(localStorage.getItem('akma_store_products')) || defaultProducts;
        let isStoreOpen = JSON.parse(localStorage.getItem('akma_store_status')) !== false; // افتراضياً مفتوح

        let selectedProduct = '';
        let selectedPrice = '';

        window.addEventListener('DOMContentLoaded', () => {
            renderStoreState();
            renderProducts();
        });

        function renderStoreState() {
            const grid = document.getElementById('productsGrid');
            const closedScreen = document.getElementById('storeClosedScreen');
            const statusBtn = document.getElementById('toggleStoreStatusBtn');

            if (isStoreOpen) {
                grid.style.display = 'grid';
                closedScreen.style.display = 'none';
                statusBtn.innerText = '🔴 إغلاق المتجر الآن';
                statusBtn.style.background = '#dc2626';
            } else {
                grid.style.display = 'none';
                closedScreen.style.display = 'flex';
                statusBtn.innerText = '🟢 فتح المتجر الآن';
                statusBtn.style.background = '#22c55e';
            }
        }

        function toggleStoreStatus() {
            isStoreOpen = !isStoreOpen;
            localStorage.setItem('akma_store_status', JSON.stringify(isStoreOpen));
            renderStoreState();
            hideModal('adminModal');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8; text-align:center; grid-column: 1/-1;">لا توجد منتجات متاحة حالياً.</p>';
                return;
            }

            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box">
                        <span class="badge-status">متوفر</span>
                        <img src="${prod.img}" alt="${prod.title}" class="product-img">
                    </div>
                    <div class="product-info">
                        <h2 class="product-title">${prod.title}</h2>
                        <p class="product-desc">${prod.desc}</p>
                        <div class="product-bottom">
                            <span class="product-price">${prod.price}</span>
                            <button class="order-btn" onclick="openOrderModal('${prod.title}', '${prod.price}')">طلب الآن</button>
                        </div>
                        <button class="delete-prod-btn" onclick="deleteProduct(${prod.id})">حذف المنتج</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addNewProduct(e) {
            e.preventDefault();
            const newProd = {
                id: Date.now(),
                title: document.getElementById('newTitle').value.trim(),
                price: document.getElementById('newPrice').value.trim(),
                img: document.getElementById('newImg').value.trim(),
                desc: document.getElementById('newDesc').value.trim()
            };

            products.unshift(newProd);
            localStorage.setItem('akma_store_products', JSON.stringify(products));
            renderProducts();
            hideModal('adminModal');
            e.target.reset();
            alert('تمت إضافة المنتج بنجاح!');
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('akma_store_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function openAdminModal() {
            // حماية بسيطة أو فتح مباشر للوحة التحكم
            document.getElementById('adminModal').style.display = 'flex';
        }

        function openOrderModal(title, price) {
            if (!isStoreOpen) {
                alert('عذراً، المتجر مغلق حالياً ولا يمكن استقبال طلبات.');
                return;
            }
            selectedProduct = title;
            selectedPrice = price;
            document.getElementById('modalProductTitle').innerText = 'طلب: ' + title;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal(e, modalId) {
            if (e.target.id === modalId) {
                hideModal(modalId);
            }
        }

        function hideModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function sendWhatsAppOrder(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const city = document.getElementById('custCity').value.trim();
            const qty = document.getElementById('custQty').value;
            const myPhoneNumber = "212614060332";

            const message = `السلام عليكم، أرغب في تأكيد طلب منتج من المتجر:%0A%0A` +
                            `🛍️ *المنتج:* ${selectedProduct}%0A` +
                            `💰 *السعر:* ${selectedPrice}%0A` +
                            `🔢 *الكمية:* ${qty}%0A%0A` +
                            `👤 *اسم المشتري:* ${name}%0A` +
                            `📞 *رقم الهاتف:* ${phone}%0A` +
                            `📍 *المدينة والعنوان:* ${city}`;

            window.open(`https://wa.me/${myPhoneNumber}?text=${message}`, '_blank');
            hideModal('orderModal');
        }
    </script>
</body>
</html>
